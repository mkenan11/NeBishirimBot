name: Bot tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check application setup without network calls
        env:
          TELEGRAM_BOT_TOKEN: '123456:offline-test-token'
          GEMINI_API_KEY: 'offline-test-key'
        run: python -c "import app, bot; bot.create_application(); print('Application setup OK')"

      - name: Run offline regression tests
        run: python -B -m unittest discover -s tests -v
